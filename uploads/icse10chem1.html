<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer | Lotus Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f5f5f5; color: #212121; }
        .container { width: 92%; max-width: 1200px; margin: auto; }
        header { background: #ffffff; box-shadow: 0 2px 15px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo img { height: 45px; }
        .logo span { font-weight: 700; color: #6a1b9a; font-size: 1.2rem; }
        .nav-links a { margin-left: 20px; text-decoration: none; color: #212121; font-weight: 500; }
        .pdf-hero { background: linear-gradient(135deg, #6a1b9a, #7b1fa2); color: white; padding: 60px 0; text-align: center; }
        .pdf-hero h1 { font-size: 2.4rem; margin-bottom: 10px; }
        .pdf-section { padding: 40px 0 80px; }
        .pdf-viewer-wrapper { background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); height: 85vh; }
        iframe { width: 100%; height: 100%; border: none; }
        footer { background: #212121; color: #ccc; padding: 30px 0; text-align: center; }
        @media (max-width: 768px) { .pdf-hero h1 { font-size: 1.9rem; } .pdf-viewer-wrapper { height: 75vh; } }
    </style>
</head>
<body>
<header><div class="container"><div class="navbar"><div class="logo"><img src="Copygg.pdf.png" alt="Lotus Academy" /> <span>Lotus Academy</span></div><div class="nav-links"><a href="https://lotusstudy.ct.ws/">Home</a> <a href="https://lotusstudy.ct.ws/Resorces/Recorces.html">Resources</a> <a href="https://lotusstudy.ct.ws/aboutus.html">About</a></div></div></div></header>
<section class="pdf-hero"><div class="container"><h1>PDF Viewer</h1><p>Generated by Lotus Academy v1.0</p></div></section>
<section class="pdf-section"><div class="container"><div class="pdf-viewer-wrapper"><iframe src="https://drive.google.com/file/d/1Vwg9IdV2tJm9Zqc5mu7FrQ4PamfxdzhQ/preview" allow="autoplay"></iframe></div></div></section>
<footer><div class="container"><p>© 2024 Lotus Academy. All Rights Reserved.</p></div></footer>

</html>
